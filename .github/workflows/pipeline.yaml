name: Build and Push Docker Image

on:
  push:
    branches:
      - master   # Trigger on pushes to master branch

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to Docker Hub (or another registry)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build and push Docker image
      - name: Build and push Docker.backend image
        uses: docker/build-push-action@v4
        with:
          context: ./BE-Music-Downloader/Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/music-downloader:latest

      
      - name: Build and push Docker.frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./FE-Music-Downloader/Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/music-downloader-frontend:latest
